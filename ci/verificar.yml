name: Verificação

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Os testes usam apenas Node; o binário do Electron não é necessário na CI.
      - name: Instalar dependências
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Checar sintaxe
        run: npm run check

      - name: Rodar testes
        run: npm test
